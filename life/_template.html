<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Life Template</title>
  <link rel="stylesheet" href="../css/site.css?v=8" />
</head>
<body>
  <h1 class="site-title title-center">[Live / Movie / Book]</h1>

  <p>Back to <a href="../index.html">homepage</a></p>

  <p class="section-label day-label">Meta</p>
  <div class="cal-items">
    <div class="cal-item">type.  live | movie | book</div>
    <div class="cal-item">date.  YYYY-MM-DD</div>
    <div class="cal-item">rating.  ★★★★☆</div>
  </div>

  <p class="section-label day-label">Feeling</p>
  <div class="cal-items">
    <div class="cal-item">Notes / feelings go here.</div>
  </div>

  <hr class="rule thin" />
  <p>Back to <a href="../index.html">homepage</a></p>
</body>
</html>
