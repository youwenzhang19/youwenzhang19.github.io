<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Template</title>
  <link rel="stylesheet" href="../css/site.css?v=8" />
</head>
<body>
  <h1 class="site-title title-center">[Project Title]</h1>

  <p>Back to <a href="../index.html">homepage</a></p>

  <p class="section-label day-label">Meta</p>
  <div class="cal-items">
    <div class="cal-item">scale.  small | medium | large</div>
    <div class="cal-item">form.  WEBSITE | SCENE + GAME | EVENT | …</div>
    <div class="cal-item">status.  active</div>
    <div class="cal-item">started.  YYYY-MM-DD</div>
    <div class="cal-item">members.  —</div>
    <div class="cal-item">progress.  0%</div>
  </div>

  <p class="section-label day-label">Brief</p>
  <div class="cal-items">
    <div class="cal-item">One-line brief goes here.</div>
  </div>

  <p class="section-label day-label">Todos</p>
  <div class="cal-items">
    <div class="cal-item">Todo item</div>
  </div>

  <p class="section-label day-label">Log</p>
  <div class="cal-items">
    <div class="cal-item">YYYY-MM-DD.  note</div>
  </div>

  <hr class="rule thin" />
  <p>Back to <a href="../index.html">homepage</a></p>
</body>
</html>
